quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://postgres-service:5432/smrpdb_uat
quarkus.mongodb.connection-string=mongodb://mongodb-service:27017

# Reactive Pool Tuning
quarkus.datasource.reactive.max-size=20

quarkus.http.port=8300
quarkus.http.host=0.0.0.0
quarkus.http.root-path=/smrp

quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5000,http://localhost:8080
quarkus.http.cors.exposed-headers=Authorization,filename,x-total-count,x-total-page

quarkus.http.enable-compression=true
quarkus.http.compressors=deflate,gzip

quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

quarkus.log.file.enabled=false
quarkus.log.file.path=/deployments/logs/app.log
quarkus.log.file.level=ERROR
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.max-backup-index=5

mongodb.prefix=default
facilityCode=13-07010010

quarkus.native.additional-build-args=--enable-native-access=ALL-UNNAMED
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enabled=true
quarkus.native.resources.includes=META-INF/openapi.json,META-INF/openapi.yaml

quarkus.redis.hosts=redis://redis-service:6379
kafka.bootstrap.servers=kafka-service.default.svc.cluster.local:9092

# mp.messaging.outgoing.prices-out.connector=smallrye-kafka
# mp.messaging.outgoing.prices-out.topic=market-prices
# mp.messaging.outgoing.prices-out.value.serializer=org.apache.kafka.common.serialization.DoubleSerializer

# mp.messaging.incoming.prices-in.connector=smallrye-kafka
mp.messaging.incoming.prices-in.topic=market-prices
# mp.messaging.incoming.prices-in.value.deserializer=org.apache.kafka.common.serialization.DoubleDeserializer
mp.messaging.incoming.prices-in.auto.offset.reset=earliest

mp.messaging.incoming.requests.topic=quote-requests-quarkus
mp.messaging.incoming.requests.auto.offset.reset=earliest

quarkus.container-image.build=true
quarkus.container-image.push=false
quarkus.kubernetes.image-pull-policy=Always

quarkus.kubernetes.deploy=true
quarkus.kubernetes.name=smrp-quarkus
quarkus.kubernetes.service-type=node-port
quarkus.kubernetes.ports.http.node-port=30080
quarkus.kubernetes.deployment-target=kubernetes
quarkus.kubernetes-client.namespace=default

quarkus.container-image.builder=docker
quarkus.container-image.registry=docker.io
quarkus.container-image.group=wfsiew888
quarkus.container-image.name=smrp-quarkus
quarkus.container-image.tag=1.0.0