quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/smrpdb_uat
quarkus.mongodb.connection-string=mongodb://localhost:27017

# Reactive Pool Tuning
quarkus.datasource.reactive.max-size=20

quarkus.http.port=8300
quarkus.http.root-path=/smrp

quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5000,http://localhost:8300
quarkus.http.cors.exposed-headers=Authorization,filename,x-total-count,x-total-page

quarkus.log.file.enable=true
quarkus.log.file.path=app.log
quarkus.log.file.level=ERROR
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.max-backup-index=5

mongodb.prefix=default
facilityCode=13-07010010